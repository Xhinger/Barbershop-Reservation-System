<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sañados Barbershop</title>
    <link rel="stylesheet" href="display_info.css">
</head>
<body>

    <header class="book-header">
        <h1 class="brand">BARBERSHOP</h1>
        <a href="home.html" class="back-link">Home</a>
    </header>

    <main class="reserve">
        <h1>Reservation Details</h1>

        <div class="reservation-card">

            <p>
                <strong>Full Name: </strong>
                <span id="display-name"></span>
            </p>

            <p>
                <strong>Contact:</strong>
                <span id="display-contact"></span>
            </p>

            <p>
                <strong>Service:</strong>
                <span id="display-service"></span>
            </p>

            <p>
                <strong>Date:</strong>
                <span id="display-date"></span>
            </p>

            <p>
                <strong>Time:</strong>
                <span id="display-time"></span>
            </p>

            <p>
                <strong>Additional Message:</strong>
                <span id="display-message"></span>
            </p>
            
        </div>
    </main>

    <script src="display_info.js"></script>
