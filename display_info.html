<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sañados Barbershop</title>
    <link rel="stylesheet" href="display_info.css">
</head>
<body>

    <header class="book-header">
        <a href="home.html" class="head">
                <img class="logo" src="/Barbershop-Reservation-System/images/logo.jpg" alt="logo">
            </a>
            
        <a href="home.html" class="back-link">Home</a>
    </header>

    <main class="reserve">
        <p class="page-kicker">Appointment confirmation</p>
        <h1>Reservation Details</h1>

        <div class="reservation-card">
            <div class="receipt-head">
                <p class="receipt-brand">SAÑADOS</p>
                <p class="receipt-subtitle">BARBERSHOP</p>
                <p class="receipt-title">RESERVATION RECEIPT</p>
            </div>

            <div class="receipt-divider"></div>

            <div class="receipt-row">
                <strong>FULL NAME</strong>
                <span id="display-name"></span>
            </div>

            <div class="receipt-row">
                <strong>CONTACT</strong>
                <span id="display-contact"></span>
            </div>

            <div class="receipt-row">
                <strong>SERVICE</strong>
                <span id="display-service"></span>
            </div>

            <div class="receipt-row">
                <strong>DATE</strong>
                <span id="display-date"></span>
            </div>

            <div class="receipt-row">
                <strong>TIME</strong>
                <span id="display-time"></span>
            </div>

            <div class="receipt-row receipt-row-message">
                <strong>ADDITIONAL MESSAGE</strong>
                <span id="display-message"></span>
            </div>

            <div class="receipt-divider"></div>
            <p class="receipt-thanks">Thank you for choosing us.</p>
            <p class="receipt-note">Please arrive 10 minutes before your appointment.</p>
        </div>
    </main>

    <script src="display_info.js"></script>
    
</body>
</html>
